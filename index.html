<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRIATURIX · Futurmovil</title>
<meta name="description" content="Cría, combate y colecciona criaturas robot. Un juego de Futurmovil.">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Criaturix">
<meta property="og:title" content="CRIATURIX · Futurmovil">
<meta property="og:description" content="Cría, combate y colecciona criaturas robot.">
<meta property="og:image" content="https://puntofibra.github.io/criaturix/img/icon-512.png">
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="favicon.ico?v=1">
<link rel="apple-touch-icon" href="img/icon-180.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<canvas id="bg"></canvas>
<div id="fx"></div>

<!-- barra superior -->
<header id="top" class="oculto">
  <button class="marca" id="tMarca" aria-label="Inicio"><img src="img/logo.webp" alt="Futurmovil"><b>CRIATURIX</b></button>
  <div class="saldos">
    <button class="saldo chips" id="tChips" title="Chips: se ganan jugando y sirven para criar"><i class="ic-chip"></i><span>0</span></button>
    <button class="saldo cred" id="tCred" title="Créditos: lo que ganas vendiendo (1 céntimo = 1 crédito)"><i class="ic-cred"></i><span>0,00</span></button>
    <button class="saldo ener" id="tEner" title="Combates con premio que te quedan hoy"><i class="ic-rayo"></i><span>20</span></button>
  </div>
  <div class="tBtns">
    <button class="ibtn" id="tSonido" aria-label="Sonido"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ondas" d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="ibtn avatar" id="tYo" aria-label="Mi cuenta"><span>?</span></button>
  </div>
</header>

<main id="app"></main>

<!-- navegación -->
<nav id="nav" class="oculto">
  <button data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg><span>Inicio</span></button>
  <button data-v="criaturas"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12" rx="5"/><circle cx="10" cy="11" r="1.6" fill="#05060f"/><circle cx="14.5" cy="11" r="1.6" fill="#05060f"/><path d="M9 3v3M15 3v3" stroke-width="2"/></svg><span>Criaturas</span></button>
  <button data-v="combatir" class="central"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M15 5h4v4M5 5l14 14M9 19H5v-4" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg><span>Combatir</span></button>
  <button data-v="criadero"><svg viewBox="0 0 24 24"><path d="M12 3c4 0 7 7 7 11a7 7 0 0 1-14 0c0-4 3-11 7-11z"/></svg><span>Criadero</span></button>
  <button data-v="mercado"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 11h-13zM8 9V7a4 4 0 0 1 8 0v2" fill="none" stroke-width="2"/></svg><span>Mercado</span></button>
</nav>

<div id="modal" class="oculto"><div class="mFondo"></div><div class="mCaja"><button class="mCerrar" aria-label="Cerrar">✕</button><div class="mCont"></div></div></div>
<div id="banner"></div>
<div id="toasts"></div>
<div id="rotar" class="oculto"></div>

<script src="js/datos.js?v=1"></script>
<script src="js/robot.js?v=11"></script>
<script src="js/qrcode.min.js?v=1" defer></script>
<script src="js/fx.js?v=2"></script>
<script src="game.js?v=2"></script>
<script src="combate.js?v=2"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
